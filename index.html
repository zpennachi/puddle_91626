<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zpennachi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Centered Content -->
  <main class="playground-container">
    
    <!-- Centered Canvas (Hover tooltip & Click to download) -->
    <section class="canvas-wrapper">
      <canvas id="glitchCanvas" title="building, learning, &amp; having fun :)"></canvas>
    </section>

    <!-- Centered Pure ASCII Sliders -->
    <section class="controls-panel">
      <div class="ascii-slider" id="amplitude-slider" data-min="-2" data-max="25" data-val="-2" data-step="1" tabindex="0" role="slider" aria-label="Amplitude" aria-valuemin="-2" aria-valuemax="25" aria-valuenow="-2"></div>
      <div class="ascii-slider" id="period-slider" data-min="-0.1" data-max="2" data-val="0.4" data-step="0.01" tabindex="0" role="slider" aria-label="Period" aria-valuemin="-0.1" aria-valuemax="2" aria-valuenow="0.4"></div>
      <div class="ascii-slider" id="effect-slider" data-min="0.1" data-max="1.3" data-val="0.99" data-step="0.001" tabindex="0" role="slider" aria-label="Effect" aria-valuemin="0.1" aria-valuemax="1.3" aria-valuenow="0.99"></div>
    </section>

  </main>

  <!-- Floating Audio Mute Control -->
  <footer class="floating-controls">
    <button id="mute-btn" class="icon-btn" title="Toggle Sound" aria-label="Toggle Sound">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
    </button>
  </footer>

  <script src="main.js"></script>
</body>
</html>
